    /* ---------- 도넛 차트 (custom SVG) ---------- */
    function Donut({ data, size = 190, stroke = 30 }) {
      const r = (size - stroke) / 2;
      const cx = size / 2;
      const cy = size / 2;
      const circ = 2 * Math.PI * r;
      const gap = 6;
      let acc = 0;
      return (
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          <circle cx={cx} cy={cy} r={r} fill="none" stroke="#F1EADF" strokeWidth={stroke} />
          <g transform={`rotate(-90 ${cx} ${cy})`}>
            {data.map((d, i) => {
              const frac = d.value / 100;
              const len = Math.max(frac * circ - gap, 0.001);
              const el = (
                <circle
                  key={i}
                  cx={cx}
                  cy={cy}
                  r={r}
                  fill="none"
                  stroke={d.color}
                  strokeWidth={stroke}
                  strokeLinecap="butt"
                  strokeDasharray={`${len} ${circ - len}`}
                  strokeDashoffset={-acc}
                />
              );
              acc += frac * circ;
              return el;
            })}
          </g>
        </svg>
      );
    }

              >
                <span className="flex h-full w-full items-center justify-center">
                  {isPlaying ? <Pause size={26} style={{ color: INK }} /> : <Play size={26} style={{ color: INK, marginLeft: 3 }} />}
                </span>
              </button>

              <div className="absolute" style={{ left: 14, right: 14, bottom: 14 }}>
                <div style={{ height: 5, borderRadius: 999, background: "rgba(255,255,255,0.35)", overflow: "hidden" }}>
                  <div
                    style={{
                      height: "100%",
                      borderRadius: 999,
                      background: "#FFFFFF",
                      width: isPlaying ? "100%" : "16%",
                      animation: isPlaying ? "progressFill 14s linear forwards" : "none",
                    }}
                  />
                </div>
              </div>
            </div>

            {/* 오늘의 미션 */}
            <div className="mt-4 flex items-start gap-3 p-4" style={{ background: "#EEF6E9", borderRadius: 20 }}>
              <div style={{ marginTop: 2 }}>
                <Brick color="green" studs={2} unit={16} />
              </div>
              <div>
                <p className="mb-1 text-xs" style={{ color: "#6FA15C", fontFamily: fontHead }}>오늘의 미션</p>
                <p className="text-sm leading-relaxed" style={{ color: INK }}>
                  초록색 블럭에 일상의 감사를 적고 탑을 쌓아보세요
                </p>
              </div>
            </div>

            <button onClick={onComplete} className="mt-4 w-full transition active:scale-95" style={primaryBtn}>
              <span className="flex items-center justify-center gap-2">
                완료하고 AR 스캔하기
                <ArrowRight size={18} />
              </span>
            </button>
          </div>
        </div>
      );
    }

    /* ---------- 2. AR 스캔 탭 ---------- */
    function ScanScreen({ status, onScan, onReset, onGoStats }) {
      if (status === "done") {
        return (
          <div className="flex min-h-full flex-col items-center justify-center px-6 py-10">
            <div className="mb-2 flex items-center gap-2" style={{ animation: "pop .4s ease" }}>
              <CheckCircle2 size={22} style={{ color: "#7CAE6A" }} />
              <span style={{ color: INK, fontFamily: fontHead, fontSize: 18 }}>스캔 완료!</span>
            </div>
            <p className="mb-8 text-center text-sm" style={{ color: INK_SOFT }}>3D 마음 탑이 저장되었습니다</p>

            <div className="relative flex flex-col items-center" style={{ animation: "pop .5s ease" }}>
              <Sparkles size={18} style={{ color: "#E5B85A", position: "absolute", top: -8, right: -4, animation: "floaty 3s ease-in-out infinite" }} />
              <div style={{ animation: "floaty 4s ease-in-out infinite" }}>
                <LegoTower bricks={myTower} unit={30} />
              </div>
              <div style={{ width: 122, height: 18, borderRadius: "50%", background: "rgba(90,82,72,0.12)", marginTop: 10, filter: "blur(2px)" }} />
            </div>

            <div className="mt-8 flex items-center gap-2 px-4 py-2" style={{ background: "#EEF6E9", borderRadius: 999 }}>
              <Heart size={14} fill="#A7CD9B" style={{ color: "#7CAE6A" }} />
              <span className="text-xs" style={{ color: "#6FA15C" }}>마음 탑 보관함에 저장됨</span>
            </div>

            <div className="mt-8 flex w-full flex-col gap-3" style={{ maxWidth: 300 }}>
              <button onClick={onGoStats} className="w-full transition active:scale-95" style={primaryBtn}>
                마음 컬러 통계 보기
              </button>
              <button onClick={onReset} className="w-full transition active:scale-95" style={ghostBtn}>
                다시 스캔하기
              </button>
            </div>
          </div>
        );
      }

      const scanning = status === "scanning";
      return (
        <div
          className="relative flex min-h-full flex-col items-center"
          style={{ background: "radial-gradient(circle at 50% 34%, #3B3B43 0%, #25252B 100%)" }}
        >
          <div className="px-6 pt-10 text-center">
            <p style={{ color: "#FFFFFF", fontFamily: fontHead, fontSize: 18, lineHeight: 1.4 }}>
              완성된 레고 탑을
              <br />
              사각형 안에 맞춰주세요
            </p>
            <p className="mt-2 text-xs" style={{ color: "rgba(255,255,255,0.55)" }}>밝은 곳에서 천천히 비춰보세요</p>
          </div>

          <div className="relative" style={{ width: 232, height: 232, marginTop: 28 }}>
            <div className="absolute inset-0" style={{ borderRadius: 24, border: "1.5px dashed rgba(255,255,255,0.18)" }} />
            <div className="absolute inset-0 flex items-end justify-center" style={{ opacity: 0.16, paddingBottom: 18 }}>
              <LegoTower bricks={myTower.slice(2)} unit={22} />
            </div>
            {corners.map((c, i) => (
              <div key={i} style={c} />
            ))}
            {!scanning && (
              <div
                style={{
                  position: "absolute",
                  left: 16,
                  right: 16,
                  top: "50%",
                  height: 2,
                  borderRadius: 999,
                  background: "linear-gradient(90deg, rgba(167,205,155,0) 0%, #A7CD9B 50%, rgba(167,205,155,0) 100%)",
                  boxShadow: "0 0 12px #A7CD9B",
                  animation: "scanline 2.4s ease-in-out infinite",
                }}
              />
            )}
            {scanning && (
              <div
                className="absolute inset-0 flex flex-col items-center justify-center"
                style={{ borderRadius: 24, background: "rgba(37,37,43,0.55)" }}
              >
                <RefreshCw size={30} className="animate-spin" style={{ color: "#A7CD9B" }} />
                <span className="mt-3 text-sm" style={{ color: "#FFFFFF" }}>마음 탑을 스캔하는 중...</span>
              </div>
            )}
          </div>

          <div className="flex-1" />

          <div className="flex flex-col items-center pb-10">
            <button
              onClick={onScan}
              disabled={scanning}
              className="flex items-center justify-center transition active:scale-95"
              style={{ width: 74, height: 74, borderRadius: "50%", background: "rgba(255,255,255,0.16)", border: "3px solid rgba(255,255,255,0.85)" }}
            >
              <span
                className="flex items-center justify-center"
                style={{ width: 54, height: 54, borderRadius: "50%", background: scanning ? "#8A8074" : "#FFFFFF" }}
              >
                <Camera size={24} style={{ color: INK }} />
              </span>
            </button>
            <span className="mt-3 text-xs" style={{ color: "rgba(255,255,255,0.7)" }}>스캔하기</span>
          </div>
        </div>
      );
    }

    /* ---------- 3. 마음 컬러 통계 탭 ---------- */
    function StatsScreen() {
      return (
        <div className="min-h-full px-5 py-8">
          <div className="mb-1 text-center">
            <h1 className="text-2xl" style={{ color: INK, fontFamily: fontHead }}>마음 컬러</h1>
            <p className="mt-1 text-sm" style={{ color: INK_FAINT }}>이번 주에 쌓은 감사 블럭 · 총 20개</p>
          </div>

          <div className="mt-5 flex flex-col items-center p-6" style={card}>
            <div className="relative">
              <Donut data={statData} size={190} stroke={30} />
              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <span className="text-3xl" style={{ color: INK, fontFamily: fontHead }}>20</span>
                <span className="text-xs" style={{ color: INK_FAINT }}>개의 감사</span>
              </div>
            </div>

            <div className="mt-5 flex w-full flex-col gap-3">
              {statData.map((s) => (
                <div key={s.label} className="flex items-center">
                  <span style={{ width: 12, height: 12, borderRadius: 4, background: s.color, display: "inline-block" }} />
                  <span className="ml-3 text-sm" style={{ color: INK, fontFamily: fontHead }}>{s.label}</span>
                  <span className="ml-2 text-xs" style={{ color: "#B3A99B" }}>{s.sub}</span>
                  <span className="ml-auto text-sm" style={{ color: s.deep, fontFamily: fontHead }}>{s.value}%</span>
                </div>
              ))}
            </div>
          </div>

          <div className="mt-4 p-5" style={{ ...card, background: "#EEF6E9" }}>
            <div className="mb-2 flex items-center gap-2">
              <Sparkles size={18} style={{ color: "#7CAE6A" }} />
              <span className="text-sm" style={{ color: "#5E7C4F", fontFamily: fontHead }}>이번 주 마음 날씨</span>
            </div>
            <p className="text-sm leading-relaxed" style={{ color: INK }}>
              이번 주는 일상의 소소한 기쁨을 아주 잘 발견하셨네요! 초록 블럭이 가장 높이 쌓였어요. 작은 만족들이 모여 단단한 마음의 탑이 되고 있어요. 🌱
            </p>
          </div>
        </div>
      );
    }

    /* ---------- 4. 연대의 숲 탭 ---------- */
    function ForestScreen({ forest, onLike }) {
      return (
        <div className="min-h-full px-5 py-8">
          <div className="mb-1 text-center">
            <div className="flex items-center justify-center gap-2">
              <Trees size={20} style={{ color: "#7CAE6A" }} />
              <h1 className="text-2xl" style={{ color: INK, fontFamily: fontHead }}>연대의 숲</h1>
            </div>
            <p className="mx-auto mt-2 text-sm leading-relaxed" style={{ color: INK_FAINT, maxWidth: 280 }}>
              이름도, 말도 없이.
              <br />
              마음의 탑으로 서로의 오늘을 응원해요
            </p>
          </div>

          <div className="mt-6 grid grid-cols-2 gap-4">
            {forest.map((t) => (
              <div key={t.id} className="flex flex-col items-center p-3" style={card}>
                <div className="flex items-end justify-center" style={{ height: 120, width: "100%" }}>
                  <div className="flex flex-col items-center">
                    <LegoTower bricks={t.bricks} unit={16} />
                    <div style={{ width: 60, height: 10, borderRadius: "50%", background: "rgba(90,82,72,0.10)", marginTop: 6, filter: "blur(1px)" }} />
                  </div>
                </div>
                <button
                  onClick={() => onLike(t.id)}
                  className="mt-2 flex items-center gap-1 transition active:scale-95"
                  style={{ background: t.liked ? "#FCEAE2" : "#F4EFE7", borderRadius: 999, padding: "6px 13px" }}
                >
                  <Heart
                    size={15}
                    fill={t.liked ? "#EFA98E" : "none"}
                    style={{ color: t.liked ? "#DB8B6C" : "#B3A99B" }}
                  />
                  <span className="text-xs" style={{ color: t.liked ? "#DB8B6C" : "#A79E90", fontFamily: fontHead }}>{t.likes}</span>
                </button>
              </div>
            ))}
          </div>

          <p className="mt-6 mb-2 text-center text-xs" style={{ color: "#C3B9AB" }}>따뜻한 불빛으로 마음을 전해보세요</p>
        </div>
      );
    }

    /* ---------- 하단 네비게이션 바 ---------- */
    function BottomNav({ tab, setTab }) {
      const items = [
        { key: "home", label: "홈", Icon: Home },
        { key: "scan", label: "AR 스캔", Icon: ScanLine },
        { key: "stats", label: "통계", Icon: PieChart },
        { key: "forest", label: "연대의 숲", Icon: Trees },
      ];
      return (
        <nav
          className="absolute bottom-0 left-0 right-0 z-50 flex"
          style={{
            height: 78,
            background: "rgba(255,255,255,0.97)",
            borderTop: "1px solid #EFE7DA",
            boxShadow: "0 -6px 20px rgba(90,82,72,0.06)",
            paddingBottom: 6,
          }}
        >
          {items.map(({ key, label, Icon }) => {
            const active = tab === key;
            return (
              <button
                key={key}
                onClick={() => setTab(key)}
                className="flex flex-1 flex-col items-center justify-center gap-1 transition active:scale-95"
              >
                <span
                  className="flex items-center justify-center transition"
                  style={{ width: 46, height: 30, borderRadius: 14, background: active ? "#EAF4E4" : "transparent" }}
                >
                  <Icon size={21} strokeWidth={active ? 2.4 : 2} style={{ color: active ? "#6FA15C" : "#B7AE9F" }} />
                </span>
                <span
                  className="text-xs"
                  style={{ color: active ? "#6FA15C" : "#B7AE9F", fontFamily: active ? fontHead : fontBody }}
                >
                  {label}
                </span>
              </button>
            );
          })}
        </nav>
      );
    }

    /* ---------- 앱 (SPA 컨테이너) ---------- */
    function App() {
      const [tab, setTab] = useState("home");
      const [showVideo, setShowVideo] = useState(false);
      const [isPlaying, setIsPlaying] = useState(false);
      const [scanStatus, setScanStatus] = useState("idle"); // idle | scanning | done
      const [forest, setForest] = useState(initialForest);

      const handleScan = () => {
        if (scanStatus !== "idle") return;
        setScanStatus("scanning");
        setTimeout(() => setScanStatus("done"), 1700);
      };

      const goScan = () => {
        setShowVideo(false);
        setIsPlaying(false);
        setScanStatus("idle");
        setTab("scan");
      };

      const toggleLike = (id) =>
        setForest((prev) =>
          prev.map((t) => (t.id === id ? { ...t, liked: !t.liked, likes: t.likes + (t.liked ? -1 : 1) } : t))
        );

      let screen = null;
      if (tab === "home") screen = <HomeScreen onStart={() => { setShowVideo(true); setIsPlaying(false); }} />;
      else if (tab === "scan")
        screen = <ScanScreen status={scanStatus} onScan={handleScan} onReset={() => setScanStatus("idle")} onGoStats={() => setTab("stats")} />;
      else if (tab === "stats") screen = <StatsScreen />;
      else if (tab === "forest") screen = <ForestScreen forest={forest} onLike={toggleLike} />;

      return (
        <div
          className="flex w-full items-center justify-center"
          style={{
            minHeight: "100vh",
            background: "linear-gradient(160deg,#EDE4D7 0%,#E1D3C2 100%)",
            padding: 16,
            fontFamily: fontBody,
          }}
        >
          <style>{styles}</style>
          <div
            className="relative overflow-hidden"
            style={{
              width: 390,
              maxWidth: "100%",
              height: 812,
              maxHeight: "94vh",
              background: CREAM,
              borderRadius: 46,
              boxShadow: "0 30px 70px rgba(60,52,44,0.35), 0 0 0 10px #1f1f24, 0 0 0 12px #34343c",
            }}
          >
            <StatusBar />
            <div
              key={tab}
              className="absolute left-0 right-0 overflow-y-auto"
              style={{ top: 36, bottom: 78, animation: "fadeUp .4s ease" }}
            >
              {screen}
            </div>
            <BottomNav tab={tab} setTab={setTab} />
            {showVideo && (
              <VideoModal
                isPlaying={isPlaying}
                setIsPlaying={setIsPlaying}
                onClose={() => { setShowVideo(false); setIsPlaying(false); }}
                onComplete={goScan}
              />
            )}
          </div>
        </div>
      );
    }

    /* ---------- 렌더 ---------- */
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
