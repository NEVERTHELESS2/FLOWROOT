<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>감정 미술관 - 감정 단어 확장</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');

        :root {
            --bg-color: #FDFBF7;
            --text-main: #4A4A4A;
            --text-sub: #9B9B9B;
            --border-color: #EFEFEF;
            --nav-bg: #FFFFFF;
        }

        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; }

        body { background-color: #E0E0E0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        #app-frame {
            width: 100%; max-width: 400px; height: 100vh; max-height: 800px;
            background-color: var(--bg-color); position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        @media (min-width: 401px) {
            #app-frame { height: 90vh; border-radius: 30px; border: 8px solid #FFFFFF; }
        }

        /* 탭 컨텐츠 영역 */
        .tab-content { display: none; height: calc(100% - 70px); overflow-y: auto; overflow-x: hidden; padding-bottom: 20px; }
        .tab-content.active { display: block; animation: fadeEffect 0.3s; }
        @keyframes fadeEffect { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 하단 네비게이션 */
        .bottom-nav {
            position: absolute; bottom: 0; width: 100%; height: 70px; background-color: var(--nav-bg);
            border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); cursor: pointer; font-size: 0.75rem; width: 33%; }
        .nav-item.active { color: var(--text-main); font-weight: 700; }
        .nav-icon { font-size: 1.5rem; }

        /* 데일리 화면 요소들 */
        header { padding: 24px 20px 10px; text-align: center; }
        h1 { font-size: 1.2rem; color: var(--text-main); font-weight: 600; }
        .date { font-size: 0.9rem; color: var(--text-sub); margin-top: 4px; }
        
        .canvas-container { padding: 0 20px; margin-bottom: 20px; }
        #canvas { width: 100%; height: 220px; background-color: #F5F5F5; border-radius: 20px; position: relative; overflow: hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
        .paint-blob { position: absolute; filter: blur(20px); opacity: 0.7; animation: fadeIn 1s ease-out forwards; transform: translate(-50%, -50%); }
        @keyframes fadeIn { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; } }

        /* 감정 팔레트 (커스텀 포함) */
        .title-row { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; margin-bottom: 10px; }
        .section-title { font-size: 0.85rem; color: var(--text-sub); }
        .edit-btn { font-size: 0.8rem; color: var(--text-sub); background: none; border: 1px solid var(--border-color); border-radius: 12px; padding: 4px 10px; cursor: pointer; }
        
        .emotion-scroll { display: flex; overflow-x: auto; padding: 0 20px 10px; gap: 14px; scrollbar-width: none; }
        .emotion-scroll::-webkit-scrollbar { display: none; }
        .emotion-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; border: none; background: none; transition: transform 0.1s; min-width: 50px; }
        .emotion-btn:active { transform: scale(0.9); }
        
        .color-shape { width: 50px; height: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 2px solid #FFF; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; transition: all 0.3s; }
        .shape-circle { border-radius: 50%; } 
        .shape-square { border-radius: 16px; } 
        .shape-teardrop { border-radius: 50% 50% 0 50%; } 
        .shape-blob { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; } 
        .emotion-name { font-size: 0.8rem; color: var(--text-main); font-weight: 500; }

        /* 단어 칩 */
        .word-chips-container { min-height: 40px; padding: 0 20px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .word-chip { padding: 8px 14px; background-color: #FFFFFF; border: 1px solid var(--border-color); border-radius: 20px; font-size: 0.85rem; color: var(--text-main); cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: 0.2s; }
        .word-chip:active { background-color: #F0F0F0; transform: scale(0.95); }
        
        /* [+] 버튼 디자인 */
        .plus-chip { width: 36px; height: 36px; border-radius: 50%; background-color: #FFF; border: 1.5px solid var(--text-sub); color: var(--text-sub); display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: 0.2s; }
        .plus-chip:active { transform: scale(0.9); background-color: #F5F5F5; }

        /* 일기장 & 하단 버튼 */
        .diary-section { padding: 0 20px; margin-bottom: 30px; }
        textarea { width: 100%; height: 80px; background-color: #FFFFFF; border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; font-size: 0.95rem; resize: none; outline: none; }
        .bottom-area { padding: 0 20px 20px; }
        .submit-btn { width: 100%; padding: 16px; background-color: var(--text-main); color: #FFF; border: none; border-radius: 16px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .ai-fab { position: absolute; bottom: 85px; right: 20px; width: 50px; height: 50px; background-color: #FFFFFF; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 1.5rem; cursor: pointer; z-index: 50; }

        /* =========================================
           공통 모달 베이스 (Bottom Sheet)
           ========================================= */
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 200; justify-content: center; align-items: flex-end; }
        .modal-overlay.active { display: flex; animation: bgFade 0.3s forwards; }
        .modal-content { width: 100%; max-height: 80%; background: #FFF; border-radius: 24px 24px 0 0; padding: 30px 20px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.3, 1); display: flex; flex-direction: column; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        @keyframes bgFade { from { opacity: 0; } to { opacity: 1; } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .modal-header h3 { font-size: 1.1rem; color: var(--text-main); display: flex; align-items: center; gap: 8px;}
        .close-btn { background: none; border: none; font-size: 1.5rem; color: var(--text-sub); cursor: pointer; }

        /* 단어 확장 모달 전용 스타일 */
        .dictionary-grid { display: flex; flex-wrap: wrap; gap: 10px; overflow-y: auto; padding-bottom: 20px; }
        .dict-chip { padding: 10px 16px; border-radius: 20px; font-size: 0.95rem; cursor: pointer; transition: 0.2s; border: 1px solid rgba(0,0,0,0.05); }
        .dict-chip:active { transform: scale(0.95); filter: brightness(0.9); }

        /* 토스트 알림 (단어 클릭 시 피드백) */
        .toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #FFF; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 300; }
        .toast.show { opacity: 1; top: 40px; }

        /* 기타 간소화된 탭 스타일 */
        .stamp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 20px; }
        .stamp-card { background: #FFF; border-radius: 12px; padding: 10px; border: 1px solid var(--border-color); }
        .stamp-img { width: 100%; height: 120px; border-radius: 8px; margin-bottom: 10px; background: linear-gradient(to bottom, #A589C1, #F0A868, #FDFBF7); }
        .masterpiece-wrapper { padding: 0 20px; margin-bottom: 30px; margin-top:20px; }
        .masterpiece-canvas { width: 100%; height: 250px; border-radius: 16px; background: linear-gradient(135deg, #6B8EB9, #A589C1, #FFD659); position: relative; }
        .floating-word { position: absolute; color: rgba(255,255,255,0.9); font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .letter-card { background-color: #FFFDF5; border: 1px solid #EAE0C8; border-radius: 2px 16px 16px 16px; padding: 24px; margin: 0 20px;}
        .letter-text { font-family: 'Gowun Dodum', sans-serif; line-height: 1.8; color: #5A5A5A;}

        /* 편집 폼 요소 */
        .edit-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .edit-item { display: flex; flex-direction: column; align-items: center; gap: 5px; opacity: 0.5; cursor: pointer; transition: 0.2s; }
        .edit-item.selected { opacity: 1; transform: scale(1.1); font-weight: bold; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 8px; }
        .custom-input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 1rem; margin-bottom: 10px; }
        .shape-selector { display: flex; gap: 15px; margin-bottom: 10px; }
        .shape-option { width: 40px; height: 40px; background: #E0E0E0; cursor: pointer; }
        .shape-option.active { border: 3px solid var(--text-main); background: #FFD659; }
        .save-btn { width: 100%; padding: 14px; background: var(--text-main); color: #FFF; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="app-frame">
    <div id="toast" class="toast">일기에 담겼어요 ✍️</div>

    <div id="tab-daily" class="tab-content active">
        <header>
            <h1>나만의 감정 미술관</h1>
            <div class="date" id="current-date"></div>
        </header>

        <div class="canvas-container">
            <div id="canvas"></div>
        </div>

        <div class="title-row">
            <div class="section-title">오늘 내 마음에 당기는 색은?</div>
            <button class="edit-btn" onclick="openModal('custom-modal')">⚙️ 편집</button>
        </div>
        <div class="emotion-scroll" id="emotion-palette"></div>

        <div class="section-title" id="word-title" style="display: none; margin-top:10px;">어떤 마음과 가장 가깝나요?</div>
        <div class="word-chips-container" id="word-chips"></div>

        <div class="diary-section">
            <textarea id="diary-input" placeholder="오늘 남기고 싶은 문장이 있다면 편하게 적어주세요.&#13;&#10;(생략하고 넘어가도 괜찮아요)"></textarea>
        </div>

        <div class="bottom-area">
            <button class="submit-btn" onclick="submitDiary()">오늘의 기록 남기기</button>
        </div>

        <div class="ai-fab" onclick="alert('감정이: 너무 많은 감정이 섞여 있다면, 단어들을 가만히 들여다보세요.')">💬</div>
    </div>

    <div id="tab-weekly" class="tab-content">
        <h2 style="padding: 30px 20px 20px; font-size:1.4rem;">나의 엽서 갤러리</h2>
        <div class="stamp-grid"><div class="stamp-card"><div class="stamp-img"></div><div style="text-align:center; font-size:0.85rem;">이번 주 엽서</div></div></div>
    </div>
    <div id="tab-monthly" class="tab-content">
        <h2 style="padding: 30px 20px 0; text-align:center; font-size:1.3rem;">이달의 마스터피스</h2>
        <div class="masterpiece-wrapper"><div class="masterpiece-canvas"><div class="floating-word word1" style="top:30%; left:20%;">몽글몽글한</div></div></div>
        <div class="letter-card"><div class="letter-text">안녕, 이번 한 달도 정말 고생 많았어.<br>너만의 모양으로 빚어낸 감정들이 참 예쁘다.</div></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('daily', this)"><div class="nav-icon">🎨</div><span>오늘</span></div>
        <div class="nav-item" onclick="switchTab('weekly', this)"><div class="nav-icon">🖼️</div><span>주간</span></div>
        <div class="nav-item" onclick="switchTab('monthly', this)"><div class="nav-icon">💌</div><span>월간</span></div>
    </div>

    <div class="modal-overlay" id="dict-modal">
        <div class="modal-content" style="height: 60%;">
            <div class="modal-header">
                <h3 id="dict-title">단어 고르기</h3>
                <button class="close-btn" onclick="closeModal('dict-modal')">×</button>
            </div>
            <div class="dictionary-grid" id="dict-grid">
                </div>
        </div>
    </div>

    <div class="modal-overlay" id="custom-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>내 감정 캐릭터 만들기</h3>
                <button class="close-btn" onclick="closeModal('custom-modal')">×</button>
            </div>
            <div class="form-label">수정할 감정을 선택하세요</div>
            <div class="edit-list" id="edit-list"></div>
            <div class="form-group">
                <label class="form-label">이름 지어주기</label>
                <input type="text" id="edit-name" class="custom-input" placeholder="예: 해피, 뾰루뚱">
            </div>
            <div class="form-group">
                <label class="form-label">캐릭터 표정 (이모지)</label>
                <input type="text" id="edit-icon" class="custom-input" placeholder="예: ✨, ☁️" maxlength="2">
            </div>
            <div class="form-group">
                <label class="form-label">도형 형태</label>
                <div class="shape-selector" id="shape-selector">
                    <div class="shape-option shape-circle active" onclick="selectShape('shape-circle', this)"></div>
                    <div class="shape-option shape-square" onclick="selectShape('shape-square', this)"></div>
                    <div class="shape-option shape-teardrop" onclick="selectShape('shape-teardrop', this)"></div>
                    <div class="shape-option shape-blob" onclick="selectShape('shape-blob', this)"></div>
                </div>
            </div>
            <button class="save-btn" onclick="saveCustomEmotion()">저장하고 반영하기</button>
        </div>
    </div>

</div>

<script>
    document.getElementById('current-date').innerText = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

    // 감정 데이터: 풍부한 단어 리스트 (allWords) 추가
    let emotions = [
        { id: 1, name: '기쁨이', color: '#FFD659', shape: 'shape-circle', icon: '✨', 
          topWords: ['뿌듯한', '짜릿한', '몽글몽글한'], 
          allWords: ['뿌듯한', '짜릿한', '몽글몽글한', '설레는', '가벼운', '신나는', '벅찬', '후련한', '경쾌한', '평온한', '다행스러운', '환희에 찬', '자랑스러운', '만족스러운', '포근한', '안도하는', '반가운'] },
        { id: 2, name: '슬픔이', color: '#6B8EB9', shape: 'shape-teardrop', icon: '💧', 
          topWords: ['울적한', '공허한', '막막한'], 
          allWords: ['울적한', '공허한', '막막한', '가라앉는', '서운한', '비참한', '처량한', '쓸쓸한', '안타까운', '허탈한', '먹먹한', '참담한', '서글픈', '애절한', '비통한', '외로운'] },
        { id: 3, name: '버럭이', color: '#E87A73', shape: 'shape-square', icon: '🔥', 
          topWords: ['답답한', '짜증나는', '분노하는'], 
          allWords: ['답답한', '짜증나는', '분노하는', '억울한', '얄미운', '화나는', '불쾌한', '거슬리는', '분개하는', '어이없는', '모욕적인', '괘씸한', '울화통 터지는', '격분한', '신경질나는'] },
        { id: 4, name: '까칠이', color: '#7FB285', shape: 'shape-square', icon: '🌵', 
          topWords: ['불편한', '거슬리는', '귀찮은'], 
          allWords: ['불편한', '거슬리는', '귀찮은', '냉소적인', '피곤한', '예민한', '퉁명스러운', '언짢은', '까다로운', '떨떠름한', '신경질적인', '무심한', '차가운'] },
        { id: 5, name: '말랑이', color: '#A589C1', shape: 'shape-blob', icon: '☁️', 
          topWords: ['위축되는', '눈치보이는', '망설여지는'], 
          allWords: ['위축되는', '눈치보이는', '망설여지는', '작아지는', '조심스러운', '쭈뼛거리는', '소극적인', '머뭇거리는', '긴장되는', '주눅드는', '부끄러운', '민망한'] },
        { id: 6, name: '불안이', color: '#F0A868', shape: 'shape-blob', icon: '🌪️', 
          topWords: ['초조한', '떨리는', '두려운'], 
          allWords: ['초조한', '떨리는', '두려운', '혼란스러운', '조마조마한', '아슬아슬한', '막연한', '걱정되는', '불안정한', '당혹스러운', '무서운', '심란한', '겁나는', '아찔한'] }
    ];

    let currentEditId = 1;

    // 1. 메인 팔레트 렌더링
    function renderPalette() {
        const palette = document.getElementById('emotion-palette');
        palette.innerHTML = '';
        emotions.forEach(emotion => {
            const btn = document.createElement('button');
            btn.className = 'emotion-btn';
            btn.innerHTML = `
                <div class="color-shape ${emotion.shape}" style="background-color: ${emotion.color}">
                    <span>${emotion.icon}</span>
                </div>
                <span class="emotion-name">${emotion.name}</span>
            `;
            btn.onclick = () => handleEmotionClick(emotion);
            palette.appendChild(btn);
        });
    }

    // 감정 클릭 시 메인 화면 동작
    function handleEmotionClick(emotion) {
        // 캔버스 칠하기
        const canvas = document.getElementById('canvas');
        const blob = document.createElement('div');
        blob.className = `paint-blob ${emotion.shape}`;
        blob.style.backgroundColor = emotion.color;
        
        const size = Math.floor(Math.random() * 80) + 120;
        const posX = Math.floor(Math.random() * 100);
        const posY = Math.floor(Math.random() * 100);
        blob.style.width = `${size}px`; blob.style.height = `${size}px`;
        blob.style.left = `${posX}%`; blob.style.top = `${posY}%`;
        canvas.appendChild(blob);

        // 상단 노출 단어 3개 + [+] 버튼 렌더링
        const wordTitle = document.getElementById('word-title');
        const wordChips = document.getElementById('word-chips');
        wordTitle.style.display = 'block';
        wordChips.innerHTML = '';
        
        emotion.topWords.forEach(word => {
            const chip = document.createElement('div');
            chip.className = 'word-chip';
            chip.innerText = word;
            chip.onclick = () => addWordToDiary(word);
            wordChips.appendChild(chip);
        });

        // 심플한 [+] 버튼
        const plusBtn = document.createElement('div');
        plusBtn.className = 'plus-chip';
        plusBtn.innerText = '+';
        plusBtn.onclick = () => openDictionary(emotion);
        wordChips.appendChild(plusBtn);
    }

    // 2. 단어장 모달 열기 및 세팅
    function openDictionary(emotion) {
        const dictTitle = document.getElementById('dict-title');
        const dictGrid = document.getElementById('dict-grid');
        
        // 제목에 현재 감정 아이콘과 이름 반영
        dictTitle.innerHTML = `<span style="font-size:1.5rem;">${emotion.icon}</span> ${emotion.name}의 마음결`;
        
        dictGrid.innerHTML = '';
        // 확장된 단어 리스트 렌더링
        emotion.allWords.forEach(word => {
            const chip = document.createElement('div');
            chip.className = 'dict-chip';
            chip.innerText = word;
            // 각 버튼에 테마 색상을 살짝 입혀 통일감 부여
            chip.style.backgroundColor = emotion.color + '20'; // 헥스 코드에 투명도(20) 추가
            chip.style.color = '#333';
            
            chip.onclick = () => {
                addWordToDiary(word);
                showToast(); // 단어가 추가되었음을 알림
            };
            dictGrid.appendChild(chip);
        });

        openModal('dict-modal');
    }

    // 일기장에 단어 추가 (메인화면, 모달 공통)
    function addWordToDiary(word) {
        const diary = document.getElementById('diary-input');
        if (diary.value === '' || diary.value.slice(-1) === ' ' || diary.value.slice(-1) === '\n') {
            diary.value += word + ' ';
        } else {
            diary.value += ' ' + word + ' ';
        }
        diary.scrollTop = diary.scrollHeight;
    }

    // 토스트 알림 띄우기
    function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 1500);
    }

    // 모달 공통 컨트롤
    function openModal(modalId) {
        document.getElementById(modalId).classList.add('active');
        if(modalId === 'custom-modal') {
            renderEditList();
            loadEmotionData(emotions[0].id);
        }
    }
    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
    }

    // 커스텀 관련 함수 (생략/유지)
    function renderEditList() {
        const editList = document.getElementById('edit-list');
        editList.innerHTML = '';
        emotions.forEach(emotion => {
            const item = document.createElement('div');
            item.className = `edit-item ${emotion.id === currentEditId ? 'selected' : ''}`;
            item.innerHTML = `<div class="color-shape ${emotion.shape}" style="background-color: ${emotion.color}; width:40px; height:40px; font-size:1rem;">${emotion.icon}</div><span style="font-size:0.7rem;">${emotion.name}</span>`;
            item.onclick = () => loadEmotionData(emotion.id);
            editList.appendChild(item);
        });
    }

    function loadEmotionData(id) {
        currentEditId = id;
        const emotion = emotions.find(e => e.id === id);
        document.getElementById('edit-name').value = emotion.name;
        document.getElementById('edit-icon').value = emotion.icon;
        selectShape(emotion.shape, document.querySelector(`.${emotion.shape}`));
        renderEditList();
    }

    let currentEditShape = 'shape-circle';
    function selectShape(shapeClass, element) {
        currentEditShape = shapeClass;
        document.querySelectorAll('.shape-option').forEach(el => el.classList.remove('active'));
        if(element) element.classList.add('active');
    }

    function saveCustomEmotion() {
        const emotionIndex = emotions.findIndex(e => e.id === currentEditId);
        if(emotionIndex !== -1) {
            emotions[emotionIndex].name = document.getElementById('edit-name').value || '이름 없음';
            emotions[emotionIndex].icon = document.getElementById('edit-icon').value || '';
            emotions[emotionIndex].shape = currentEditShape;
        }
        renderPalette();
        closeModal('custom-modal');
    }

    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        element.classList.add('active');
    }

    function submitDiary() {
        if (document.getElementById('canvas').children.length === 0) {
            alert('캔버스에 오늘 마음의 색을 한 번이라도 칠해주세요!'); return;
        }
        alert('오늘의 마음이 예쁘게 저장되었습니다.');
    }

    renderPalette();
</script>
</body>
</html>
